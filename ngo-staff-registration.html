<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpSphere - NGO Staff Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #176b4d;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #176b4d;
        }

        .register-btn {
            grid-column: 1 / -1;
            background: #176b4d;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #11533b;
        }

        .notice {
            grid-column: 1 / -1;
            background: #eef7f2;
            border-left: 4px solid #176b4d;
            padding: 12px;
            color: #555;
            font-size: 14px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #176b4d;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            form {
                grid-template-columns: 1fr;
            }

            .full,
            .register-btn,
            .notice {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>HelpSphere</h1>
        <p>Donation Coordinator / NGO Staff Registration</p>
    </div>

    <form>

        <div class="notice">
            NGO staff accounts require administrator approval before they can access the system.
        </div>

        <div>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div>
            <label>Official Email Address</label>
            <input type="email" placeholder="Enter official email" required>
        </div>

        <div>
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>
        </div>

        <div>
            <label>Staff ID</label>
            <input type="text" placeholder="Enter staff ID" required>
        </div>

        <div>
            <label>NGO / Organization Name</label>
            <input type="text" placeholder="Enter organization name" required>
        </div>

        <div>
            <label>NGO Registration Number</label>
            <input type="text" placeholder="Enter NGO registration number" required>
        </div>

        <div>
            <label>Position / Designation</label>
            <input type="text" placeholder="e.g. Donation Coordinator" required>
        </div>

        <div>
            <label>Organization Type</label>
            <select required>
                <option value="">Select Type</option>
                <option>Non-Governmental Organization</option>
                <option>Charity Organization</option>
                <option>Non-Profit Organization</option>
                <option>Community Organization</option>
                <option>Relief Organization</option>
            </select>
        </div>

        <div>
            <label>Areas of Operation</label>
            <input type="text" placeholder="e.g. Dhaka, Chattogram" required>
        </div>

        <div>
            <label>Organization Website</label>
            <input type="url" placeholder="https://example.org">
        </div>

        <div class="full">
            <label>Organization Address</label>
            <textarea placeholder="Enter complete organization address" required></textarea>
        </div>

        <div>
            <label>NGO Registration Document</label>
            <input type="file" required>
        </div>

        <div>
            <label>Staff Identification Document</label>
            <input type="file" required>
        </div>

        <div>
            <label>Password</label>
            <input type="password" placeholder="Create password" required>
        </div>

        <div>
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password" required>
        </div>

        <button type="submit" class="register-btn">
            Submit Registration
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="#">Login</a>
    </div>

</div>

</body>
</html>
